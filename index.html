<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17302d">
  <meta name="color-scheme" content="light">
  <title>我们的回忆</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23f5f0e9'/%3E%3Cpath d='M20 31C-1 17 13 5 20 15C27 5 41 17 20 31' fill='%2398776f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dioramas.css">
  <script src="js/main.js" defer></script>
  <script type="module" src="js/dioramas.js"></script>
</head>
<body>
<main id="app">
  <section class="screen opening active" id="screen-1" aria-label="在一起的时间">
    <div class="opening-flower" aria-hidden="true"></div>
    <div class="opening-content">
      <div class="fine-line" aria-hidden="true"></div>
      <h1>我们在一起已经</h1>
      <div class="clock" role="timer" aria-label="在一起的时间">
        <div class="days"><span id="days">000</span><span class="day-unit">天</span></div>
        <div class="time"><span id="hours">00</span><i>时</i><span id="minutes">00</span><i>分</i><span id="seconds">00</span><i>秒</i></div>
      </div>
      <form id="date-form" class="entry-form" novalidate>
        <label class="sr-only" for="date-input">输入在一起的日期，8 位数字</label>
        <input id="date-input" type="text" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="输入属于我们的日期" autocomplete="off" enterkeyhint="go" aria-describedby="date-error">
        <p class="error" id="date-error" role="status"></p>
        <button class="button" type="submit"><span>进入</span><span aria-hidden="true">↗</span></button>
      </form>
    </div>
  </section>
  <section class="screen flowers" id="screen-2" aria-label="洋桔梗" inert aria-hidden="true">
    <img class="scene-art flower-art" src="assets/scenes/flowers.jpg" alt="奶白与浅紫色洋桔梗，枝叶交织成一片温柔的花海">
    <div class="scene-bottom"><button class="button light" data-next="3">继续 <span aria-hidden="true">↗</span></button></div>
  </section>
  <section class="screen question road" id="screen-3" aria-label="第一个问题" inert aria-hidden="true">
    <div class="question-content">
      <span class="question-mark" aria-hidden="true">?</span>
      <h2>我们经常走过的那条路，<br>是什么路？</h2>
      <form id="road-form" class="answer-form" novalidate>
        <label class="sr-only" for="road-input">那条路的名字</label>
        <input id="road-input" placeholder="写下你的答案" autocomplete="off" enterkeyhint="go" maxlength="80" aria-describedby="road-error">
        <p class="error" id="road-error" role="status"></p>
        <button class="button light" type="submit">提交 <span aria-hidden="true">↗</span></button>
      </form>
    </div>
    <div class="reveal" inert aria-hidden="true">
      <img class="scene-art" src="assets/scenes/road.jpg" alt="深蓝夜色中，一盏盏暖黄路灯照亮延伸向远处的马路">
      <div class="scene-bottom"><button class="button light" data-next="4">继续 <span aria-hidden="true">↗</span></button></div>
    </div>
  </section>
  <section class="screen question restaurant" id="screen-4" aria-label="第二个问题" inert aria-hidden="true">
    <div class="question-content">
      <span class="question-mark" aria-hidden="true">?</span>
      <h2>我们的幸福小馆<br>是什么？</h2>
      <form id="restaurant-form" class="answer-form" novalidate>
        <label class="sr-only" for="restaurant-input">幸福小馆的名字</label>
        <input id="restaurant-input" placeholder="写下你的答案" autocomplete="off" enterkeyhint="go" maxlength="80" aria-describedby="restaurant-error">
        <p class="error" id="restaurant-error" role="status"></p>
        <button class="button" type="submit">提交 <span aria-hidden="true">↗</span></button>
      </form>
    </div>
    <div class="reveal" inert aria-hidden="true">
      <img class="scene-art" src="assets/scenes/restaurant.jpg" alt="安静小巷里的湘菜馆，木门与窗户透出温暖灯光">
      <div class="scene-bottom"><button class="button light" data-next="5">继续 <span aria-hidden="true">↗</span></button></div>
    </div>
  </section>
  <section class="screen memories" id="screen-5" aria-label="照片回忆" inert aria-hidden="true">
    <div class="photo-stage" aria-label="回忆照片">
      <img class="memory-photo" id="photo-a" alt="">
      <img class="memory-photo" id="photo-b" alt="">
    </div>
    <h2 class="ending" tabindex="-1">未完待续<span aria-hidden="true">···</span></h2>
  </section>
</main>
</body>
</html>
